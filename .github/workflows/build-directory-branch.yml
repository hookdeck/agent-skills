# Generates the directory-only build of the plugin and commits it to the
# `directory` branch, which is the branch the Anthropic plugin directory tracks.
#
# The branch is generated: never edit it by hand. See "Directory branch" in
# README.md.
#
# Requirements:
#   - The `directory` branch exists (it was created once from an orphan commit).
#   - The workflow needs `contents: write` (set below). If branch protection on
#     `directory` requires pull requests or blocks the GitHub Actions bot, the
#     push fails; leave `directory` unprotected or allow github-actions[bot].
#   - Pushes made with GITHUB_TOKEN are normal commits (no force-push). The
#     directory still sees them through its scheduled check or push webhook.

name: Build directory branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-directory-branch
  cancel-in-progress: false

jobs:
  build:
    name: Build and commit to directory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and check the directory plugin
        working-directory: source
        run: node scripts/build-directory.mjs "$RUNNER_TEMP/directory-build"

      - name: Checkout directory branch
        uses: actions/checkout@v4
        with:
          ref: directory
          path: target

      - name: Replace branch contents with the build
        run: |
          find target -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/directory-build/." target/

      - name: Commit and push if changed
        working-directory: target
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to the directory build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: directory build from main@${SOURCE_SHA:0:7}" \
            -m "Generated by .github/workflows/build-directory-branch.yml. Do not edit this branch by hand."
          git push origin HEAD:directory
